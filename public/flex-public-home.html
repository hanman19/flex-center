    action:'IMPORT 견적 요청 안내',
  },
];
const page=document.getElementById('page');
const menu=document.getElementById('service-menu');
const buttons=(primary,href,secondary,other)=>`<div class="actions"><a class="button" href="${href}">${primary} <span aria-hidden="true">↗</span></a>${secondary?`<a class="button secondary" href="${other}">${secondary}</a>`:''}</div>`;
const list=(items,tag='ul',css='')=>`<${tag}${css?' class="'+css+'"':''}>${items.map(item=>'<li>'+item+'</li>').join('')}</${tag}>`;
const cards=()=>`<div class="service-list">${services.map(service=>`<a class="service-card" href="#${service.id}">
  <h3>${service.brand}</h3><strong>${service.short}</strong><p>${service.description}</p><span class="arrow" aria-hidden="true">↗</span>
</a>`).join('')}</div>`;
const system=`<div class="system"><div><h2 class="section-title">고객용 FLEX 시스템</h2>
  <p class="section-intro">신청한 서비스의 진행 상황을 확인하고 필요한 자료를 제출할 수 있습니다.</p></div>
  <dl class="system-list"><div><dt>PREP</dt><dd>입고 예정 등록, 입고 라벨 출력, 작업·출고 진행 확인</dd></div>
  <div><dt>E-SHIPPING</dt><dd>이용 승인 확인, 특송 운영공간에서 화물 처리 현황 확인</dd></div>
  <div><dt>BUY · IMPORT</dt><dd>요청한 견적과 거래 진행 내역 확인</dd></div></dl></div>`;
const integrations=`<section class="integrations" id="integrations" aria-labelledby="integrations-title">
  <p class="label">자동 연동 개발 계획</p>
  <h3 id="integrations-title">플랫폼 정보는 한 번만 입력하도록</h3>
  <p class="section-intro">판매 계정을 연결하면 FLEX에서 필요한 상품과 입고 정보를 불러와 반복 입력을 줄이는 기능을 준비하고 있습니다.</p>
  <dl class="integration-grid">
    <div><dt>Amazon FBA</dt><dd>입고 계획·SKU·수량을 불러오고 상품과 출고 박스 라벨을 연결하는 기능</dd></div>
    <div><dt>Walmart WFS</dt><dd>상품과 입고 정보를 불러와 예정 수량과 실제 처리 내역을 대조하는 기능</dd></div>
    <div><dt>Shopify · 해외 3PL</dt><dd>Shopify 상품·SKU 정보를 불러와 3PL 입고 준비에 활용하는 기능</dd></div>
    <div><dt>TikTok Shop FBT</dt><dd>상품과 입고 정보를 불러와 바코드, 수량과 준비 작업을 확인하는 기능</dd></div>
  </dl>
  <p class="note">플랫폼별 자동 연동은 개발 예정입니다. 현재는 입고 정보를 직접 등록하고 필요한 라벨 파일을 첨부할 수 있습니다.</p>
</section>`;
const home=`<section class="home-first" aria-labelledby="home-title"><div>
    <h1 id="home-title" lang="en">Across Borders.<br><span>In Sync.</span></h1>
    <p class="lead">국제특송 현장 운영부터 플랫폼 입고 준비, 해외 구매·수입과 국내 납품까지. 신청과 진행 현황은 FLEX에서 확인하세요.</p>
    ${buttons('서비스 둘러보기','#services','ABOUT FLEX','#company')}
  </div><aside class="finder" aria-labelledby="finder-title"><h2 id="finder-title">어떤 업무를 맡기시나요?</h2>
    ${services.map(service=>`<a href="#${service.id}"><span><strong>${service.question}</strong><small>${service.brand}</small></span><span class="arrow" aria-hidden="true">↗</span></a>`).join('')}
  </aside></section>`;
const company=`<section id="company" class="home-section" aria-labelledby="company-title"><div class="inner-hero"><div>
    <h2 id="company-title" class="section-title" lang="en">ABOUT FLEX</h2><p class="lead">플렉스센터는 국제특송의 국내 현장 운영과 해외 구매·수입에 필요한 실무를 지원합니다.</p>
  </div><div class="scope"><h3>함께 일하는 고객</h3><p>국제특송 포워더, 해외 플랫폼 셀러와 브랜드, 해외 상품을 구매하는 기업과 기관</p></div></div>
  <div class="details-grid">
    <section class="detail"><h3>현장 물류 운영</h3><p>특송 화물이 도착하면 입고 대조, 계측, 라벨과 분류 작업을 거쳐 픽업을 인계합니다. 플랫폼 입고를 준비하는 상품은 필요한 검수와 포장 작업을 진행합니다.</p></section>
    <section class="detail"><h3>해외 구매·수입과 국내 납품</h3><p>상품 링크나 품명으로 요청을 받아 구매 조건과 예상 비용을 확인합니다. 고객사 명의 수입대행과 제휴 수입업체를 통한 국내 납품을 지원합니다.</p></section>
  </div></section>`;
const guide=`<section id="guide" class="home-section" aria-labelledby="guide-title"><h2 id="guide-title" class="section-title" lang="en">HOW IT WORKS</h2>
  <p class="section-intro">서비스별 신청 절차와 요금·견적 확인 방법을 확인하세요.</p>
  <div>${services.map(service=>`<section class="guide-block" id="guide-${service.id}"><h3>${service.brand}</h3>
    ${list(service.steps,'ol','steps')}<p class="note">${service.note}</p>
    <div class="next-links"><a class="text-link" href="#${service.id}">서비스 상세 보기 →</a></div></section>`).join('')}</div>
  <section class="section faq"><h3 class="section-title">자주 묻는 질문</h3>
    <details><summary>PREP과 E-SHIPPING 요금표는 어디서 보나요?</summary><p>서비스 이용 신청 후 관리자 승인을 받으면 로그인한 계정에서 회원 요금표를 확인할 수 있습니다.</p></details>
    <details><summary>BUY와 IMPORT의 수입자는 각각 누구인가요?</summary><p>BUY에서는 고객사가 수입자이며, IMPORT에서는 제휴 수입업체가 수입자로 진행합니다.</p></details>
    <details><summary>상품 링크가 없어도 BUY 견적을 요청할 수 있나요?</summary><p>품명, 모델명, 사양과 필요 수량으로 공급처 확인 및 견적을 요청할 수 있습니다.</p></details>
  </section></section>`;
function detail(service){
  return `<article class="service-description" id="${service.id}" aria-labelledby="${service.id}-title">
    <div class="inner-hero"><div><p class="label">${service.brand}</p><h2 id="${service.id}-title">${service.short}</h2><p class="lead">${service.description}</p></div>
    <aside class="scope"><h3>이용 대상</h3><p>${service.audience}</p></aside></div>
    <div class="details-grid"><section class="detail"><h3>맡길 수 있는 작업</h3>${list(service.work)}</section>
    <section class="detail"><h3>준비할 정보</h3>${list(service.ready)}</section></div>
    ${service.id==='prep'?integrations:''}
    <p class="note">${service.note}</p>
    <div class="next-links"><a class="button" href="#guide-${service.id}">${service.action} <span aria-hidden="true">↓</span></a><a class="text-link" href="#services">다른 서비스 보기</a></div></article>`;
}
page.innerHTML=home+company+`<section id="services" class="home-section" aria-labelledby="services-title">
  <h2 id="services-title" class="section-title" lang="en">SERVICES</h2>${cards()}
  <div class="next-links"><a class="text-link" href="#integrations">Amazon·Walmart·Shopify·TikTok 연동 개발 계획 →</a></div>
  ${services.map(detail).join('')}
</section><section class="home-section">${system}</section>`+guide;
function updateNavigation(){
  const target=location.hash;
  for(const link of document.querySelectorAll('header .nav a')){
    const href=link.getAttribute('href');
    if(href===target||(href==='#guide'&&target.startsWith('#guide-'))) link.setAttribute('aria-current','location');
    else link.removeAttribute('aria-current');
  }
  menu.dataset.current=String(target==='#services'||target==='#integrations'||services.some(service=>target==='#'+service.id));
  menu.open=false;
}
window.addEventListener('hashchange',updateNavigation);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&menu.open){menu.open=false;menu.querySelector('summary').focus();}
});
document.addEventListener('click',event=>{if(!menu.contains(event.target)) menu.open=false;});
menu.addEventListener('click',event=>{if(event.target.closest('a')) menu.open=false;});
updateNavigation();
</script>
</body>
</html>
