<!doctype html>
<html lang="ko" data-palette="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원가입 준비 중 · FLEX CENTER</title>
<meta name="robots" content="noindex">
<style>
:root{font:16px/1.65 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color-scheme:light;--ink:#111;--mute:#545454;--line:#e2e2e2;--deep:#111;--paper:#fff;--accent:#204ac0;--light:#96b8ff;--tint:#f0f4ff}
html[data-palette="orange"]{--accent:#a83d11;--light:#ffab73;--tint:#fff3eb}
html[data-palette="violet"]{--accent:#6334a5;--light:#c8a4ff;--tint:#f6f0ff}
html[data-palette="gold"]{--accent:#79560f;--light:#f5c96a;--tint:#fcf6e7}
*{box-sizing:border-box}
body,h1,h2,p,ul{margin:0}body{background:var(--paper);color:var(--ink)}a{color:inherit;text-decoration:none}p{word-break:keep-all}
.wrap{width:min(1220px,calc(100% - 80px));margin-inline:auto}
.preview{padding:6px 0;background:var(--tint);color:var(--mute);font-size:12px;border-bottom:1px solid var(--line)}
.header{background:#fff;border-bottom:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:76px}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px}
.brand-mark{display:grid;place-items:center;width:37px;height:37px;flex:none;background:var(--deep);border-radius:8px}
.brand-mark::before{content:"";width:20px;height:20px;background:var(--light);clip-path:polygon(0 0,100% 0,84% 24%,26% 24%,26% 43%,80% 43%,64% 66%,26% 66%,26% 100%,0 100%)}
.brand:hover .brand-mark{background:#292929}.brand-wordmark{display:grid;gap:2px;line-height:1}
.brand-wordmark strong{font-family:"DM Sans","Segoe UI",system-ui,sans-serif;font-size:24px;font-weight:900;letter-spacing:-.065em}
.brand-wordmark small{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.19em}
.back{font-size:14px;font-weight:740;min-height:44px;display:flex;align-items:center}.back:hover{text-decoration:underline;text-underline-offset:5px}
.layout{display:grid;grid-template-columns:.85fr 1.15fr;align-items:start;gap:clamp(24px,8vw,110px);padding:clamp(30px,6vw,78px) 0 48px;max-width:1030px}
h1{font-size:clamp(37px,5.3vw,64px);line-height:1.13;font-weight:850;letter-spacing:-.085em}
h1::after{content:"";display:block;width:clamp(34px,6vw,74px);height:4px;margin-top:14px;background:var(--accent)}
.lead{margin-top:15px;color:var(--mute);font-size:clamp(15px,1.55vw,18px);max-width:35ch}
.guide{margin-top:22px;padding:16px 17px;background:var(--deep);color:#fff;border-radius:8px}
.guide h2{font-size:16px;margin-bottom:4px}.guide ul{padding-left:19px;color:#eee;font-size:13px}
.form-panel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:clamp(17px,3.4vw,32px)}
.form-panel h2{font-size:21px;letter-spacing:-.045em;margin-bottom:10px}
form,.row{display:grid;gap:13px}.row{grid-template-columns:1fr 1fr}
label{display:grid;gap:4px;font-size:14px;font-weight:720;min-width:0}
input,button{width:100%;font:inherit;min-height:45px;padding:8px 10px;border-radius:6px}
input{background:#fff;color:var(--ink);border:1px solid #a8a8a8;font-size:16px}
button{background:var(--deep);color:#fff;border:1px solid var(--deep);font-weight:750;cursor:pointer}
button:hover{background:#292929}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#password-help,.fine{font-size:12px;color:var(--mute);font-weight:450}
.fine{margin-top:12px}.notice{font-size:13px;margin-bottom:14px;background:var(--tint);border-left:3px solid var(--accent);padding:8px 10px}
#preview-result{margin-top:12px;margin-bottom:0}
.footer{border-top:1px solid var(--line);font-size:13px;color:var(--mute);padding:17px 0}
@media(max-width:760px){.wrap{width:calc(100% - 36px)}.layout{grid-template-columns:1fr;gap:20px}.head{min-height:63px}.guide{margin-top:15px}}
@media(max-width:410px){.row{grid-template-columns:1fr}}
.fields{border:0;margin:0;padding:0;min-width:0;display:grid;gap:13px}.fields input:disabled{border-color:#d4d4d4;background:#f5f5f5}.fields button:disabled{background:#e6e6e6;border-color:#e6e6e6;color:#555;cursor:default}.existing{display:inline-block;margin-top:14px;color:var(--accent);font-size:14px;font-weight:750;text-decoration:underline;text-underline-offset:4px}</style>
</head>
<body>

<header class="header"><nav class="wrap head" aria-label="FLEX 계정 메뉴">
  <a class="brand" href="/" aria-label="FLEX CENTER 홈">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-wordmark" aria-hidden="true"><strong>FLEX</strong><small>CENTER</small></span>
  </a>
  <a class="back" href="/">홈으로 돌아가기 ↗</a>
</nav></header>
<main class="wrap layout">
  <section aria-labelledby="signup-title">
    <h1 id="signup-title">회원가입 준비 중</h1>
    <p class="lead">현재 신규 회원가입 접수를 준비 중입니다. 기존 회원은 로그인해 서비스를 이용할 수 있습니다.</p>
    <a class="existing" href="https://flex-operations.onrender.com/signin-with-chatgpt">기존 회원 로그인 ↗</a>
    <aside class="guide" aria-labelledby="guide-title">
      <h2 id="guide-title">가입 후 이용 방법</h2>
      <ul><li>PREP과 E-SHIPPING은 서비스 이용 승인 후 요금표를 확인합니다.</li><li>BUY와 IMPORT는 필요한 상품 정보를 보내 견적을 요청합니다.</li></ul>
    </aside>
  </section>
  <section class="form-panel" aria-labelledby="form-title">
    <h2 id="form-title">가입 화면 안내</h2>
    <p class="notice">회원가입이 열리면 아래 정보를 입력할 수 있습니다.</p>
    <fieldset disabled class="fields" aria-label="가입 입력 항목 예시">
      <label>회사 / 브랜드명<input name="company" autocomplete="organization" maxlength="120" required></label>
      <div class="row"><label>담당자명<input name="contact" autocomplete="name" maxlength="60" required></label>
      <label>연락처<input name="phone" type="tel" autocomplete="tel" maxlength="30" required placeholder="010-1234-5678"></label></div>
      <label>업무 이메일<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
      <label>비밀번호<input name="password" type="password" autocomplete="off" minlength="12" maxlength="128" aria-describedby="password-help" required>
      <small id="password-help">12자 이상으로 대문자, 소문자, 숫자, 특수문자(!, @ 등)를 각각 넣어 주세요. 영문과 기호만 사용할 경우 최대 72자입니다.</small></label>
      <label>비밀번호 확인<input name="confirm" type="password" autocomplete="off" minlength="12" maxlength="128" required></label>
      <button type="button" disabled>신규 가입 준비 중</button>
    </fieldset>
  </section>
</main>
<footer class="footer"><div class="wrap">© FLEX CENTER · 플렉스센터</div></footer>

</body>
</html>
